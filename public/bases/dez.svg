  <!-- mouth -->
  <path d="M368 585 Q400 608 432 585" stroke="#8a4030" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M375 586 Q400 598 425 586" fill="#8a4030" opacity="0.35"/>

  <!-- neon side strip -->
  <rect x="0" y="180" width="10" height="420" fill="#ff6a4a" opacity="0.7"/>
  <rect x="790" y="180" width="10" height="420" fill="#ff6a4a" opacity="0.35"/>

