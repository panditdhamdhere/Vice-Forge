  <ellipse cx="400" cy="485" rx="148" ry="178" fill="#d4a574"/>
  <!-- cheek shade -->
  <ellipse cx="320" cy="520" rx="28" ry="36" fill="#000" opacity="0.08"/>
  <ellipse cx="480" cy="520" rx="28" ry="36" fill="#000" opacity="0.08"/>

  
      <circle cx="280" cy="360" r="55" fill="#111111"/>
      <circle cx="340" cy="300" r="60" fill="#111111"/>
      <circle cx="420" cy="285" r="65" fill="#111111"/>
      <circle cx="500" cy="320" r="58" fill="#111111"/>
      <circle cx="540" cy="390" r="50" fill="#111111"/>
      <ellipse cx="400" cy="360" rx="160" ry="110" fill="#111111"/>
    

  <!-- brows -->
  <path d="M312 448 Q345 432 378 448" stroke="#111111" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M422 448 Q455 430 490 448" stroke="#111111" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="345" cy="488" rx="22" ry="14" fill="#faf6f0"/>
  <ellipse cx="455" cy="488" rx="22" ry="14" fill="#faf6f0"/>
  <ellipse cx="345" cy="490" rx="11" ry="12" fill="#1a1410"/>
  <ellipse cx="455" cy="490" rx="11" ry="12" fill="#1a1410"/>
  <circle cx="349" cy="486" r="3.5" fill="#fff" opacity="0.85"/>
  <circle cx="459" cy="486" r="3.5" fill="#fff" opacity="0.85"/>

  

  
  <circle cx="252" cy="520" r="7" fill="#ff6a4a"/>
  <circle cx="252" cy="538" r="4" fill="#ff6a4a" opacity="0.7"/>
  

  <!-- nose -->
