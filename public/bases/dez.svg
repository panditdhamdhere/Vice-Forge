  <path d="M120 1000 C180 780 250 720 400 720 C550 720 620 780 680 1000 Z" fill="url(#shirtGrad)"/>
  <path d="M250 780 L320 720 L400 760 L480 720 L550 780" fill="none" stroke="#ff6a4a" stroke-width="3" opacity="0.35"/>

  <!-- neck -->
  <path d="M360 620 C370 700 430 700 440 620 L430 720 C410 760 390 760 370 720 Z" fill="#d4a574"/>

