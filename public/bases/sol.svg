<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0a121c"/>
      <stop offset="100%" stop-color="#1a3040"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9c46a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e9c46a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#e9c46a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a121c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#264653"/>
      <stop offset="100%" stop-color="#0a121c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#halo)"/>

  <!-- city skyline -->
  <g opacity="0.55" fill="#0a121c">
    <rect x="40" y="560" width="70" height="220"/>
    <rect x="120" y="500" width="55" height="280"/>
    <rect x="185" y="540" width="90" height="240"/>
    <rect x="290" y="470" width="48" height="310"/>
    <rect x="560" y="490" width="70" height="290"/>
    <rect x="640" y="530" width="95" height="250"/>
    <rect x="720" y="500" width="50" height="280"/>
  </g>
  <g fill="#e9c46a" opacity="0.55">
    <rect x="55" y="590" width="8" height="10"/><rect x="75" y="620" width="8" height="10"/>
    <rect x="135" y="530" width="8" height="10"/><rect x="150" y="560" width="8" height="10"/>
    <rect x="210" y="580" width="8" height="10"/><rect x="240" y="610" width="8" height="10"/>
    <rect x="580" y="520" width="8" height="10"/><rect x="610" y="560" width="8" height="10"/>
    <rect x="670" y="560" width="8" height="10"/><rect x="700" y="600" width="8" height="10"/>
  </g>

  <!-- film grain bars -->
  <rect x="0" y="0" width="800" height="28" fill="#e9c46a" opacity="0.12"/>
  <rect x="0" y="972" width="800" height="28" fill="#e9c46a" opacity="0.18"/>

  <!-- identity label -->
  <text x="36" y="72" font-family="Arial Black, Helvetica, sans-serif" font-size="54" fill="#e9c46a" letter-spacing="10">SOL</text>
  <text x="38" y="104" font-family="Arial, sans-serif" font-size="16" fill="#f4ebe1" opacity="0.55" letter-spacing="4">COAST SMUGGLER · VICE COAST</text>

  <!-- shoulders / jacket -->
  <path d="M120 1000 C180 780 250 720 400 720 C550 720 620 780 680 1000 Z" fill="url(#shirtGrad)"/>
  <path d="M250 780 L320 720 L400 760 L480 720 L550 780" fill="none" stroke="#e9c46a" stroke-width="3" opacity="0.35"/>

  <!-- neck -->
  <path d="M360 620 C370 700 430 700 440 620 L430 720 C410 760 390 760 370 720 Z" fill="#ffdbac"/>

  <!-- head -->
  <ellipse cx="400" cy="485" rx="148" ry="178" fill="#ffdbac"/>
  <!-- cheek shade -->
  <ellipse cx="320" cy="520" rx="28" ry="36" fill="#000" opacity="0.08"/>
  <ellipse cx="480" cy="520" rx="28" ry="36" fill="#000" opacity="0.08"/>

  
      <path d="M255 430 C270 290 520 270 545 410 C500 330 320 340 255 430 Z" fill="#5c3317"/>
      <ellipse cx="400" cy="335" rx="155" ry="85" fill="#5c3317"/>
    

  <!-- brows -->
  <path d="M312 448 Q345 432 378 448" stroke="#5c3317" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M422 448 Q455 430 490 448" stroke="#5c3317" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="345" cy="488" rx="22" ry="14" fill="#faf6f0"/>
  <ellipse cx="455" cy="488" rx="22" ry="14" fill="#faf6f0"/>
  <ellipse cx="345" cy="490" rx="11" ry="12" fill="#1a1410"/>
  <ellipse cx="455" cy="490" rx="11" ry="12" fill="#1a1410"/>
  <circle cx="349" cy="486" r="3.5" fill="#fff" opacity="0.85"/>
  <circle cx="459" cy="486" r="3.5" fill="#fff" opacity="0.85"/>

  

  

  <!-- nose -->
  <path d="M400 500 L388 548 L412 548" stroke="#000" stroke-opacity="0.18" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- mouth -->
  <path d="M368 585 Q400 608 432 585" stroke="#c56a54" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M375 586 Q400 598 425 586" fill="#c56a54" opacity="0.35"/>

  <!-- neon side strip -->
  <rect x="0" y="180" width="10" height="420" fill="#e9c46a" opacity="0.7"/>
  <rect x="790" y="180" width="10" height="420" fill="#e9c46a" opacity="0.35"/>

  <!-- bottom stamp -->
  <rect x="0" y="910" width="800" height="90" fill="#070b14" opacity="0.72"/>
  <text x="36" y="948" font-family="Arial Black, sans-serif" font-size="28" fill="#e9c46a" letter-spacing="6">COVER BASE</text>
  <text x="36" y="978" font-family="Arial, sans-serif" font-size="16" fill="#f4ebe1" opacity="0.65" letter-spacing="3">READY FOR REACT IMAGE EDITOR</text>
</svg>