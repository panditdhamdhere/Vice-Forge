  <ellipse cx="480" cy="520" rx="28" ry="36" fill="#000" opacity="0.08"/>

  
      <path d="M245 420 C250 270 550 270 555 420 C580 520 560 650 540 700 C500 640 300 640 260 700 C240 650 220 520 245 420 Z" fill="#3a2208"/>
      <ellipse cx="400" cy="325" rx="170" ry="95" fill="#3a2208"/>
    

