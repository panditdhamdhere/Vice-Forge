<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#100818"/>
      <stop offset="100%" stop-color="#2a1040"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cf5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7cf5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#7cf5ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#100818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a4a"/>
      <stop offset="100%" stop-color="#100818"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#halo)"/>

  <!-- city skyline -->
