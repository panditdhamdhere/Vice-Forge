<svg xmlns='http://www.w3.org/2000/svg' width='800' height='1000' viewBox='0 0 800 1000'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#1A0B2E'/>
      <stop offset='100%' stop-color='#FF6B4A'/>
    </linearGradient>
    <radialGradient id='glow' cx='50%' cy='30%' r='60%'>
      <stop offset='0%' stop-color='#FF6B4A' stop-opacity='0.55'/>
      <stop offset='100%' stop-color='#1A0B2E' stop-opacity='0'/>
    </radialGradient>
  </defs>
  <rect width='800' height='1000' fill='url(#bg)'/>
  <rect width='800' height='1000' fill='url(#glow)'/>
  <text x='40' y='80' font-family='Arial Black, sans-serif' font-size='42' fill='#7CF5FF' opacity='0.9' letter-spacing='8'>LUNA</text>
  <text x='40' y='120' font-family='Arial, sans-serif' font-size='18' fill='#F5EDE6' opacity='0.55'>VICE COAST COVER</text>
  <!-- shoulders -->
  <ellipse cx='400' cy='920' rx='280' ry='160' fill='#FF2D95'/>
  <!-- neck -->
  <rect x='355' y='620' width='90' height='120' rx='20' fill='#C68642'/>
  <!-- head -->
  <ellipse cx='400' cy='480' rx='150' ry='180' fill='#C68642'/>
  <!-- hair -->
  <path d='M250 450 C260 280 540 280 550 450 C520 320 280 320 250 450 Z' fill='#2C1810'/>
  <ellipse cx='400' cy='340' rx='160' ry='90' fill='#2C1810'/>
  <!-- eyes -->
  <ellipse cx='345' cy='480' rx='18' ry='12' fill='#1a1a1a'/>
  <ellipse cx='455' cy='480' rx='18' ry='12' fill='#1a1a1a'/>
  <circle cx='350' cy='478' r='5' fill='#fff' opacity='0.7'/>
  <circle cx='460' cy='478' r='5' fill='#fff' opacity='0.7'/>
  <!-- brows -->
  <path d='M310 445 Q345 430 380 445' stroke='#2C1810' stroke-width='8' fill='none' stroke-linecap='round'/>
  <path d='M420 445 Q455 430 490 445' stroke='#2C1810' stroke-width='8' fill='none' stroke-linecap='round'/>
  <!-- nose -->
  <path d='M400 490 L390 540 L410 540' stroke='#000' stroke-opacity='0.2' stroke-width='4' fill='none'/>
  <!-- mouth -->
  <path d='M370 580 Q400 600 430 580' stroke='#000' stroke-opacity='0.35' stroke-width='5' fill='none' stroke-linecap='round'/>
  <!-- accent bar -->
  <rect x='0' y='940' width='800' height='60' fill='#7CF5FF' opacity='0.85'/>
  <text x='40' y='978' font-family='Arial, sans-serif' font-size='22' fill='#0B1220' font-weight='700'>FORGE YOUR COVER</text>
</svg>